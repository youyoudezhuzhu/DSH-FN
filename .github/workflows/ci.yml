# DSH-FN CI: 这是 dsh-go 的裁剪分支，构建期只验证本 fork 仍然存在的部分。
#
#   * 生成物同步：l10n、用户指南、回放页
#   * Flutter analyze（0 error 即可；历史遗留的 info 不阻塞）
#   * 核心测试：fnos 连接模块、架构约束、状态缓存（golden/本机引擎用例未随 fork 保留）
#   * Dart packages：dsh_client / dsh_tavern 的 analyze + test
#   * Android：Kotlin 主代码编译
#
# APK 的实际构建在 build-apk.yml（手动触发或打 v* tag）。
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FLUTTER_VERSION: 3.47.7
  NODE_VERSION: 24.22.1
  GRADLE_VERSION: 9.3.1
  TZ: Asia/Shanghai

jobs:
  changes:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      app: ${{ github.event_name != 'pull_request' || steps.filter.outputs.app == 'true' }}
      packages: ${{ github.event_name != 'pull_request' || steps.filter.outputs.packages == 'true' }}
    steps:
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            ci: &ci .github/workflows/ci.yml
            app: [*ci, 'app/**', 'packages/**', 'docs/guide/**', 'tooling/**']
            packages: [*ci, 'packages/**']

  checks:
    name: Generated files & tooling
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - &checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - &node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Generated files are in sync
        run: |
          python3 app/tool/l10n_merge.py --check
          python3 app/tool/guide_sync.py --check
          python3 app/tool/make_replay_viewer.py --check
      - name: Python tooling
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q Pillow==13.0.0 numpy==2.4.0
          for dir in tooling app/tool; do
            "$RUNNER_TEMP/venv/bin/python" -m unittest discover -s "$dir" -p 'test_*.py'
          done

  analyze:
    name: Flutter analyze
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - *checkout
      - *node
      - &flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      # Info-level deprecations are pre-existing in the shared UI; errors and
      # warnings still fail the job.
      - name: Analyze, and generated localization matches its source
        run: |
          flutter analyze --no-pub --no-fatal-infos
          python3 tool/l10n_merge.py
          git diff --exit-code -- lib/l10n

  flutter:
    name: Flutter core tests
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DSH_TEST_FONT_DIR: /usr/share/fonts/opentype/noto
    defaults:
      run:
        working-directory: app
    steps:
      - *checkout
      - *node
      - *flutter
      # Widget tests load real CJK fonts (test/support/test_fonts.dart).
      - name: Install the CJK fonts the widget tests load
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk fonts-noto-cjk-extra fonts-noto-color-emoji
      - run: flutter pub get --enforce-lockfile
      # The upstream full suite covered the removed on-device engine, SSH, relay
      # and golden screenshots; this fork keeps the modules it still ships.
      - name: fnOS connection + architecture + state caches + updates
        run: |
          flutter test --no-pub --reporter github \
            test/fnos test/arch test/state/cache_state_test.dart test/update

  dart:
    name: Dart packages
    needs: changes
    if: needs.changes.outputs.packages == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - *checkout
      - *flutter
      - name: Dependencies
        run: |
          for pkg in dsh_client dsh_tavern; do
            (cd "packages/$pkg" && dart pub get --enforce-lockfile)
          done
      - name: Analyze and test both packages
        run: |
          names=(dsh_client dsh_tavern)
          pids=()
          for pkg in "${names[@]}"; do
            (cd "packages/$pkg" && dart analyze && dart test) > "$RUNNER_TEMP/$pkg.log" 2>&1 &
            pids+=($!)
          done
          status=0
          for i in "${!pids[@]}"; do
            wait "${pids[$i]}" || status=1
            cat "$RUNNER_TEMP/${names[$i]}.log"
          done
          exit "$status"

  android:
    name: Android Kotlin
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - *checkout
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - *flutter
      - name: Flutter plugins and local.properties
        working-directory: app
        run: |
          flutter pub get --enforce-lockfile
          printf 'sdk.dir=%s\nflutter.sdk=%s\n' "$ANDROID_HOME" "$FLUTTER_ROOT" > android/local.properties
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
      # Compiles the native layer (no Dart build task: build-apk.yml covers packaging).
      - name: Prefer Maven Central for Gradle plugin resolution
        run: |
          mkdir -p "$HOME/.gradle/init.d"
          cat > "$HOME/.gradle/init.d/dsh-plugin-repos.gradle.kts" <<'EOF'
          settingsEvaluated {
              pluginManagement {
                  repositories {
                      mavenCentral()
                      maven { url = uri("https://maven.aliyun.com/repository/central") }
                      google()
                      gradlePluginPortal()
                  }
              }
          }
          EOF
      - working-directory: app/android
        run: gradle --stacktrace :app:compileArm64DebugKotlin

  ci-ok:
    name: CI OK
    if: always()
    needs: [changes, checks, analyze, flutter, dart, android]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - if: >-
          needs.changes.result != 'success' || contains(needs.*.result, 'failure') ||
          contains(needs.*.result, 'cancelled')
        run: exit 1

# Builds installable DSH-FN APKs on GitHub's runners.
#
#   * 手动触发（workflow_dispatch）：选 ABI（默认 arm64，手机用 arm64；x64 给模拟器）
#   * 打 tag（v*）：构建 arm64 并把 APK 附到 GitHub Release 上
#
# 签名：仓库里没有 key.properties / keystore（凭据不入库），release 构建回退到
# debug 签名，产出的 APK 可以直接安装，但不是正式发布签名。需要正式签名时，
# 在仓库 Secrets 里放 key.properties（base64）与 keystore 后在 workflow 里还原。
name: Build APK

on:
  workflow_dispatch:
    inputs:
      flavor:
        description: 'ABI flavor'
        type: choice
        default: arm64
        options: [arm64, x64]
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.7
  GRADLE_VERSION: 9.3.1
  TZ: Asia/Shanghai

jobs:
  apk:
    name: APK (${{ github.event.inputs.flavor || 'arm64' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # gradlew is deliberately not tracked (see app/android/.gitignore); build one
      # from the Gradle this action installs, pinned to the same version CI uses.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Project metadata, Gradle wrapper, dependencies
        working-directory: app
        run: |
          flutter pub get --enforce-lockfile
          printf 'sdk.dir=%s\nflutter.sdk=%s\n' "$ANDROID_HOME" "$FLUTTER_ROOT" > android/local.properties
          if [ ! -x android/gradlew ]; then
            (cd android && gradle wrapper --gradle-version "$GRADLE_VERSION" \
              --gradle-distribution-url "https://services.gradle.org/distributions/gradle-$GRADLE_VERSION-bin.zip")
            chmod +x android/gradlew
          fi

      - name: Build release APK
        working-directory: app
        env:
          FLAVOR: ${{ github.event.inputs.flavor || 'arm64' }}
        run: |
          flutter build apk --release --flavor "$FLAVOR"
          ls -l build/app/outputs/flutter-apk/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dsh-fn-${{ github.event.inputs.flavor || 'arm64' }}-release
          path: app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

      # Tag push: publish the APK so it can be downloaded without signing in.
      - name: Attach APK to the Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/app/outputs/flutter-apk/*.apk
          generate_release_notes: true
